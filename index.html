<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amsterdam Soundboard</title>

    <!-- Import JavaScript -->
    <script src="app.js" defer></script>

    <!-- Import fonts from Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..700;1,400..700&family=Quicksand:wght@300..700&display=swap" rel="stylesheet">
    <!-- Import Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>


<body class="default-screen">
    <div id = "page-title">
        <h1 class= "font-alt", style="padding-left: 15px;"> Sounds of Amsterdam;
            
        </h1>
    </div>

    <!-- Build Dashboard-->
    <div class="ambient-dashboard">
        <h2 class="font-alt">Select a location</h2>

        <div id="location-menu" class="menu-grid"></div>

        <!-- Main Controls-->
         <div class="audio-controls">
            <button id="global-play-btn" disabled>Select a location to start</button>

            <label for="ambient-volume">Ambient Noise Volume:</label>
            <input type="range" id="ambient-volume" min="0" max="1" step="0.01" value="0.5">

            <label for="music-volume">Music Volume:</label>
            <input type="range" id="music-volume" min="0" max="1" step="0.01" value="0.5">

         </div>
    </div>
    
</body>
</html>
